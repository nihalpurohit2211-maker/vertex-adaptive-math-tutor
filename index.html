<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Vertex — exam-ready notes. Turn messy notes and a syllabus into a prioritized plan, missed-the-lecture lessons with computed worked examples, and a one-page personal sheet. Built on the BharatCode model API.">
  <meta name="color-scheme" content="dark">
  <title>Vertex — exam-ready notes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#root">Skip to content</a>

  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">▲</span>
      <span class="brand-name">Vertex</span>
      <span class="brand-tag">exam-ready notes</span>
    </div>
    <nav class="main-nav" aria-label="Main navigation">
      <button type="button" class="nav-btn" data-route="#/setup">Setup</button>
      <button type="button" class="nav-btn" data-route="#/map">Plan</button>
      <button type="button" class="nav-btn" data-route="#/sheet">Sheet</button>
      <button type="button" class="nav-btn" id="btn-settings" aria-label="Open settings">⚙ Settings</button>
    </nav>
  </header>

  <main id="root" tabindex="-1" aria-live="polite"></main>

  <footer class="app-footer">
    <p class="footer-brand">Vertex — exam-ready notes</p>
    <p class="footer-tagline">Exam-ready without picking up a pen.</p>
    <p class="footer-note">Built on the BharatCode model API · notes stay in your browser.</p>
  </footer>

  <!-- Toast stack (main.js owns it) -->
  <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

  <!-- Settings modal mount (views/settings.js owns it) -->
  <div id="settings-modal-root"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
